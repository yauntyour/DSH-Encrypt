# dsh-encrypt bundle patch: applied after dsh-base's insert.
#
# A row patch cannot rename a row (the loader rejects name mismatches), so the
# swap is disable + insert: the base bundle's plaintext `credentials` row is
# disabled and dsh-encrypt is inserted as its own row. It provides the same
# `ctx.credentials` seam, so every consumer — the LLM adapters, the web Models
# page, web-search — keeps working unchanged.
#
# One file, two forms: $DSH_HOME/.credentials.yaml is plaintext YAML (the
# versioned refs/records layout shared with credentials-local) until a password
# is set in Settings → 加密安全, then the same file's contents are replaced by
# an AES-256-GCM encrypted document (SHA3-256 fingerprints) whose master key is
# stretched from the password digest with Argon2id. Structured credential
# records are sealed per policy: machine-sealed ones stay readable while
# locked (boot-time consumers), password-sealed ones do not.
# Web compositions additionally mount the `dsh-encrypt/web` row for the
# browser password routes and the output redaction install.
#
# Security hardening (all on by default; see README → 安全模型):
#   - leakGuard:        mask resolved credential values in WebUI responses /
#                       WebSocket frames (prompt-injection echo defense)
#   - maxUnlockAttempts / lockoutBaseMs / lockoutMaxMs:
#                       exponential unlock lockout against online guessing
#   - shipped-file consistency self-check (fail-closed, generated by pnpm build)
- id: credentials
  disabled: true

- insert:
    - id: dsh-encrypt
      name: 'dsh-encrypt'
      config:
        # Keep the inherited environment and .env fallback layers (read-only,
        # ranked above the managed file). Set false for a strict file-only policy.
        allowEnvFallback: true
        # rememberChannel: cookie   # 免密票据通道：cookie（默认，仅 HttpOnly）| header（响应体+localStorage，XSS 可读）
        # leakGuard: true
        # leakMinMaskLength: 8
        # leakMaxMaskLength: 256
        # maxUnlockAttempts: 5
        # lockoutBaseMs: 30000
        # lockoutMaxMs: 900000
